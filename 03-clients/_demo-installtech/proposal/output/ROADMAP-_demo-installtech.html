<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">

<body>
<title>InstallTech BV — AI-integratie roadmap</title>
<style>
/* Roadmap proposal — house style: warm paper, accent from engagement-config.
   Theme contract: custom props on :root, dark via @media AND [data-theme]
   overrides (the artifact viewer toggle must win in both directions). */

:root {
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#22272E; --ink-2:#5C6672; --ink-3:#8B93A0;
  --line:#E8E2D8; --grid:#EDE7DC;
  --accent:#D9480F; --accent-fg:#FFFFFF;
  --accent-dark:color-mix(in srgb, var(--accent) 80%, black);
  --accent-text:color-mix(in srgb, var(--accent) 85%, black);
  --accent-soft:color-mix(in srgb, var(--accent) 9%, var(--bg));
  --ok:#2B8A3E;
  /* categorical series (F4 allocation) — muted, medium lightness, no red/green pair */
  --c-automation:#0B8272; --c-agent-t1:#3B77C2; --c-agent-t2:#7A5BD6;
  --c-agent-t3:#B0498C;   --c-hybrid:#9C7514;
  --shadow:0 1px 2px rgba(34,39,46,.05), 0 6px 20px rgba(34,39,46,.06);
  --mono:ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#171412; --card:#201C18; --ink:#EDE7DF; --ink-2:#B3AA9E; --ink-3:#877E73;
  --line:#352F28; --grid:#2B2620;
  --accent-fg:#FFFFFF;
  --accent-dark:color-mix(in srgb, var(--accent) 78%, black);
  --accent-text:color-mix(in srgb, var(--accent) 62%, white);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--bg));
  --ok:#57B36A;
  --c-automation:#35B3A0; --c-agent-t1:#6FA8EC; --c-agent-t2:#A28BEA;
  --c-agent-t3:#D57EB4;   --c-hybrid:#C7A22C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"] {
  --bg:#171412; --card:#201C18; --ink:#EDE7DF; --ink-2:#B3AA9E; --ink-3:#877E73;
  --line:#352F28; --grid:#2B2620;
  --accent-fg:#FFFFFF;
  --accent-dark:color-mix(in srgb, var(--accent) 78%, black);
  --accent-text:color-mix(in srgb, var(--accent) 62%, white);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, var(--bg));
  --ok:#57B36A;
  --c-automation:#35B3A0; --c-agent-t1:#6FA8EC; --c-agent-t2:#A28BEA;
  --c-agent-t3:#D57EB4;   --c-hybrid:#C7A22C;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  --bg:#FBF8F3; --card:#FFFFFF; --ink:#22272E; --ink-2:#5C6672; --ink-3:#8B93A0;
  --line:#E8E2D8; --grid:#EDE7DC;
  --accent-fg:#FFFFFF;
  --accent-dark:color-mix(in srgb, var(--accent) 80%, black);
  --accent-text:color-mix(in srgb, var(--accent) 85%, black);
  --accent-soft:color-mix(in srgb, var(--accent) 9%, var(--bg));
  --ok:#2B8A3E;
  --c-automation:#0B8272; --c-agent-t1:#3B77C2; --c-agent-t2:#7A5BD6;
  --c-agent-t3:#B0498C;   --c-hybrid:#9C7514;
  --shadow:0 1px 2px rgba(34,39,46,.05), 0 6px 20px rgba(34,39,46,.06);
}

* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { display:flex; max-width:1340px; margin:0 auto; gap:34px; padding:0 26px 130px; }
a { color:var(--accent-text); }
code { font:12.5px var(--mono); background:var(--accent-soft); border-radius:4px; padding:1px 5px; }
.num, output, .figure { font-variant-numeric:tabular-nums; }

nav.rail { position:sticky; top:0; align-self:flex-start; width:196px; flex:none;
  padding:34px 0 22px; display:flex; flex-direction:column; gap:2px; }
nav.rail .brand { font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); margin:0 0 14px 12px; }
nav.rail a { color:var(--ink-2); text-decoration:none; font-size:13.5px;
  padding:6px 12px; border-radius:7px; }
nav.rail a:hover { background:var(--accent-soft); color:var(--ink); }
nav.rail a:focus-visible, button:focus-visible, input:focus-visible,
summary:focus-visible, [tabindex]:focus-visible
  { outline:2px solid var(--accent); outline-offset:2px; }
#theme-toggle { margin:16px 0 0 12px; align-self:flex-start; font:600 12.5px system-ui,sans-serif;
  border:1px solid var(--line); background:var(--card); color:var(--ink-2);
  border-radius:20px; padding:5px 13px; cursor:pointer; }
#theme-toggle:hover { border-color:var(--accent); color:var(--ink); }
main { flex:1; min-width:0; max-width:1020px; }
@media (max-width:900px) { nav.rail { display:none; } .wrap { gap:0; padding:0 16px 150px; } }

header.hero { padding:50px 0 8px; }
.eyebrow { font-size:11.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent-text); font-weight:650; margin:0 0 10px; }
h1 { font-size:clamp(26px,3.4vw,37px); line-height:1.15; margin:0 0 12px;
  font-weight:700; letter-spacing:-.015em; text-wrap:balance; }
.hero p.lede { font-size:16.5px; color:var(--ink-2); max-width:64ch; margin:0; }
.hero .stamp { font:12px var(--mono); color:var(--ink-3); margin-top:14px; }

section { margin-top:54px; scroll-margin-top:24px; }
h2 { font-size:21px; font-weight:700; letter-spacing:-.01em; margin:0 0 6px; text-wrap:balance; }
.kicker { font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-3); font-weight:650; margin:0 0 6px; }
section > p.sub { color:var(--ink-2); max-width:70ch; margin:0 0 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:13px;
  box-shadow:var(--shadow); padding:20px 22px; }

/* headline stats */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(205px,1fr)); gap:12px; margin:26px 0 0; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 18px; }
.stat .v { font-size:29px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat .l { font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.stat .n { font-size:11.5px; color:var(--ink-3); margin-top:6px; }

/* assumptions */
.assump { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px 28px; }
.assump label { display:block; font-size:13px; color:var(--ink-2); }
.assump .row { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.assump .row span:first-child { color:var(--ink); font-weight:600; }
.assump output { font:650 15px var(--mono); color:var(--ink); }
.assump input[type=range] { width:100%; accent-color:var(--accent); margin-top:6px; }
.assump .src { font-size:11.5px; color:var(--ink-3); margin-top:3px; line-height:1.45; }
.assump-foot { margin-top:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.assump-foot .note-inline { font-size:12px; color:var(--ink-3); }
button.ghost { font:600 12.5px system-ui,sans-serif; border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); border-radius:20px; padding:6px 15px; cursor:pointer; }
button.ghost:hover { border-color:var(--accent); color:var(--ink); }

/* chips */
.chip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  border-radius:20px; padding:2px 10px; white-space:nowrap; }
.chip i { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.chip.plain { color:var(--ink-2); background:var(--bg); border:1px solid var(--line); }
.chip.qw { color:var(--accent-text); background:var(--accent-soft); }
.chip.bb { color:var(--c-agent-t1); background:color-mix(in srgb, var(--c-agent-t1) 13%, var(--card)); }
.chip.fi { color:var(--ink-2); background:color-mix(in srgb, var(--ink) 7%, var(--card)); }
.chip.dc { color:var(--ink-3); background:transparent; border:1px dashed var(--line); }

/* filters */
.filters { display:flex; flex-wrap:wrap; gap:8px 8px; margin:0 0 16px; align-items:center; }
.filters .glabel { font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:650; margin-right:2px; }
.filters button { font:600 12.5px system-ui, sans-serif; border:1px solid var(--line);
  background:var(--card); color:var(--ink-2); border-radius:20px; padding:5px 13px; cursor:pointer; }
.filters button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.filters .sep { width:1px; align-self:stretch; background:var(--line); margin:2px 5px; }

/* opportunity cards */
.opp { border:1px solid var(--line); border-radius:13px; background:var(--card);
  box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
.opp.discard { opacity:.75; }
.opp.discard .ot { color:var(--ink-2); }
.opp summary { list-style:none; cursor:pointer; padding:13px 18px; display:flex; flex-wrap:wrap;
  align-items:center; gap:9px 12px; }
.opp summary::-webkit-details-marker { display:none; }
.opp summary:hover { background:var(--accent-soft); }
.opp .pick { width:17px; height:17px; accent-color:var(--accent); cursor:pointer; flex:none; }
.opp .oid { font:650 12px var(--mono); color:var(--ink-3); }
.opp .ot { font-size:15px; font-weight:650; flex:1 1 240px; }
.opp .ov { font:650 14px var(--mono); font-variant-numeric:tabular-nums; margin-left:auto; }
.opp .o-body { border-top:1px solid var(--line); padding:16px 20px 18px;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px 26px; }
.opp .o-body h4 { margin:0 0 4px; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-3); }
.opp .o-body p { margin:0; font-size:13.8px; color:var(--ink-2); }
.opp .o-body p strong { color:var(--ink); }
.opp .full { grid-column:1 / -1; }
.scoreline { font:12.5px var(--mono); color:var(--ink-2); }
.scoreline b { color:var(--ink); }

/* scatter */
.viz { background:var(--card); border:1px solid var(--line); border-radius:13px;
  box-shadow:var(--shadow); padding:18px 18px 8px; }
.viz .legend { display:flex; flex-wrap:wrap; gap:12px; padding:2px 4px 10px;
  font-size:12.5px; color:var(--ink-2); align-items:center; }
.viz svg { display:block; width:100%; height:auto; }
.viz text { font:11.5px system-ui, sans-serif; fill:var(--ink-2); }
.viz .axl { fill:var(--ink-3); font-size:11px; }
.viz .quad { fill:var(--ink-3); font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; }
.viz .dotl { font:650 10.5px var(--mono); fill:var(--ink); }
.viz line, .viz rect.qbg, .viz text { pointer-events:none; }
.viz .pt.dim { opacity:.15; }
.tip { position:fixed; z-index:60; pointer-events:none; background:var(--card); color:var(--ink);
  border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:8px 12px;
  font-size:12.5px; max-width:300px; display:none; }
.tip b { display:block; margin-bottom:2px; }
.tip .figure { font-family:var(--mono); }

/* roadmap */
.waves { display:grid; grid-template-columns:repeat(auto-fit,minmax(255px,1fr)); gap:14px; }
.wave { border:1px solid var(--line); border-radius:13px; background:var(--card); box-shadow:var(--shadow); }
.wave .w-h { padding:14px 18px 11px; border-bottom:1px solid var(--line); }
.wave .w-h .t { font-weight:700; font-size:15px; }
.wave .w-h .s { font-size:12px; color:var(--ink-3); }
.wave .w-h .v { font:650 12.5px var(--mono); color:var(--accent-text); margin-top:6px; line-height:1.5; }
.wave ul { list-style:none; margin:0; padding:10px 18px 16px; display:flex; flex-direction:column; gap:9px; }
.wave li { font-size:13.5px; color:var(--ink-2); }
.wave li .oref { font:650 11px var(--mono); color:var(--accent-text); cursor:pointer; }
.wave li.off { opacity:.5; text-decoration:line-through; text-decoration-color:var(--ink-3); }
.wave li .liv { font:600 12px var(--mono); color:var(--ink-3); white-space:nowrap; }

/* keep / method */
.keep-body h3, .keep-body h4 { margin:1.2em 0 .4em; font-size:15px; }
.keep-body ul { margin:.4em 0; padding-left:20px; }
.keep-body li { margin-bottom:6px; color:var(--ink-2); }
.keep-body p { color:var(--ink-2); max-width:72ch; }
.note { border-left:3px solid var(--accent); background:var(--accent-soft);
  border-radius:0 10px 10px 0; padding:12px 16px; font-size:13.5px; color:var(--ink-2); max-width:75ch; }
.note strong { color:var(--ink); }

/* confirm bar */
#confirm-bar { position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding:10px max(18px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); }
#confirm-bar .cb-in { max-width:1340px; margin:0 auto; display:flex; align-items:center;
  gap:16px 22px; flex-wrap:wrap; }
#confirm-bar .cb-stat { font-size:13px; color:var(--ink-2); }
#confirm-bar .cb-stat b { font:650 14px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums; }
#confirm-bar .cb-btn { margin-left:auto; font:650 13.5px system-ui,sans-serif;
  background:var(--accent); color:var(--accent-fg); border:none; border-radius:999px;
  padding:10px 22px; cursor:pointer; }
#confirm-bar .cb-btn:hover { background:var(--accent-dark); }
#confirm-bar .cb-btn:disabled { opacity:.45; cursor:not-allowed; }

/* confirm dialog */
dialog#confirm-dialog { border:1px solid var(--line); border-radius:14px; background:var(--card);
  color:var(--ink); box-shadow:var(--shadow); padding:24px 26px; max-width:620px; width:min(92vw,620px); }
dialog#confirm-dialog::backdrop { background:rgba(20,16,12,.45); backdrop-filter:blur(2px); }
#confirm-dialog h3 { margin:0 0 4px; font-size:18px; }
#confirm-dialog .d-sub { font-size:13px; color:var(--ink-2); margin:0 0 14px; }
#confirm-dialog h4 { margin:14px 0 4px; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3); }
#confirm-dialog ul { margin:0; padding-left:2px; list-style:none; }
#confirm-dialog li { font-size:13.5px; color:var(--ink-2); padding:2px 0; }
#confirm-dialog li .oid { font:650 11.5px var(--mono); color:var(--accent-text); }
#confirm-dialog .d-total { margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
  font:650 14px var(--mono); font-variant-numeric:tabular-nums; }
#confirm-dialog .d-note { font-size:12px; color:var(--ink-3); margin-top:8px; }
#confirm-dialog .d-actions { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
#confirm-dialog .d-actions a, #confirm-dialog .d-actions button {
  font:650 13px system-ui,sans-serif; border-radius:999px; padding:9px 18px; cursor:pointer;
  text-decoration:none; }
#confirm-dialog a.dl { background:var(--accent); color:var(--accent-fg); border:1px solid var(--accent); }
#confirm-dialog a.dl:hover { background:var(--accent-dark); }
#confirm-dialog .d-actions button { background:var(--card); color:var(--ink-2); border:1px solid var(--line); }
#confirm-dialog .d-actions button:hover { border-color:var(--accent); color:var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  .opp, .stat, .filters button { transition:border-color .12s, background .12s; }
}
@media print {
  nav.rail, #confirm-bar, #theme-toggle, .filters { display:none !important; }
  .wrap { padding-bottom:20px; }
  body { background:#fff; }
}

</style>

<div class="wrap">
<nav class="rail" aria-label="Sections">
  <p class="brand" data-i18n="brand"></p>
  <a href="#overzicht" data-i18n="navOverview"></a>
  <a href="#aannames" data-i18n="navAssumptions"></a>
  <a href="#kaart" data-i18n="navMap"></a>
  <a href="#register" data-i18n="navRegister"></a>
  <a href="#roadmap" data-i18n="navRoadmap"></a>
  <a href="#keep" id="nav-keep" data-i18n="navKeep"></a>
  <a href="#methode" data-i18n="navMethod"></a>
  <button id="theme-toggle" type="button" aria-pressed="false"></button>
</nav>
<main>

<header class="hero" id="overzicht">
  <p class="eyebrow" data-i18n="eyebrow"></p>

  <div class="stats">

    <div class="stat" id="st-hours-tile"><div class="v" id="st-hours">—</div><div class="l" data-i18n="stHours"></div><div class="n" data-i18n="stHoursNote"></div></div>
    <div class="stat"><div class="v" id="st-wave1">—</div><div class="l" data-i18n="stWave1"></div><div class="n" data-i18n="stWave1Note"></div></div>

</header>

<section id="aannames">
  <p class="kicker" data-i18n="kAssump"></p>

<section id="kaart">

<section id="register">

</section>

  <p class="kicker" data-i18n="kMethod"></p>
  <h2 data-i18n="hMethod"></h2>
  <p class="sub" id="method-weights"></p>
  <p class="note" id="method-note"></p>
</section>

</main>
</div>

<div id="confirm-bar" role="region">
  <div class="cb-in">
    <span class="cb-stat" id="cb-count"></span>
    <span class="cb-stat" id="cb-value"></span>
    <span class="cb-stat" id="cb-cost"></span>
    <button class="cb-btn" id="cb-btn" type="button"></button>

</div>

<dialog id="confirm-dialog">
  <h3 data-i18n="dTitle"></h3>
  <p class="d-sub" data-i18n="dSub"></p>
  <div id="d-body"></div>

<script>
var DATA = {
  "client": "InstallTech BV",
  "slug": "_demo-installtech",
  "lang": "nl",
  "accent": "#D9480F",
  "sector": "HVAC-installatie",
  "currency": "EUR",
  "day_rate": 950,
  "built": "2026-07-09T09:24:10Z",
  "weights": {
    "value": {
      "hours": 0.5,
      "quality": 0.25,
      "strategic": 0.25
    },
    "feasibility": {
      "data": 0.4,
      "technical": 0.3,
      "ownership": 0.3
    },
    "high": 3.5
  },
  "hourly_id": "loaded_hourly_cost",
  "assumptions": [
    {
      "id": "quotes_per_month",
      "label": {
        "nl": "Offertes per maand",
        "en": "Quotes per month"
      },
      "unit": "/maand",
      "min": 20,
      "max": 80,

  });
}

/* ---------------- headline ---------------- */
function renderHeadline() {
  var port = portfolio(), total = 0, y1 = 0, hourVal = 0;
  port.forEach(function (o) {
    var v = oppValue(o);
    if (isFinite(v)) { total += v; if (o.uses_hourly) hourVal += v; }
    y1 += o.year1_cost;
  });
  document.getElementById("st-total").textContent = fmt(total);
  document.getElementById("st-wave1").textContent = port.filter(function (o) { return o.wave === 1; }).length;
  document.getElementById("st-payback").textContent = total > 0 ? fmtMonths(y1 / (total / 12)) : "—";
  if (DATA.hourly_id) {
    var hc = state.A[DATA.hourly_id];
    document.getElementById("st-hours").textContent =
      hc > 0 ? "≈ " + Math.round(hourVal / hc).toLocaleString(locale) + " " + S.hoursUnit : "—";
  }
}

/* ---------------- filters ---------------- */
function uniq(arr) { return arr.filter(function (v, i) { return arr.indexOf(v) === i; }); }
function renderFilters() {
  var f = document.getElementById("reg-filters");
  var depts = uniq([].concat.apply([], DATA.opps.map(function (o) { return o.departments; }))).sort();
  var allocs = uniq(DATA.opps.map(function (o) { return o.allocation; }));
  var statuses = uniq(DATA.opps.map(function (o) { return o.status; }));
  var quads = ["quick-win", "big-bet", "fill-in", "discard"].filter(function (q) {
    return DATA.opps.some(function (o) { return o.quadrant === q; });
  });
  function group(label, key, values, names) {
    var h = '<span class="glabel">' + esc(label) + "</span>";
    h += '<button data-g="' + key + '" data-v="all"' + (state.filters[key] === "all" ? ' class="on"' : "") + ">" + esc(S.fAll) + "</button>";
    values.forEach(function (v) {
      h += '<button data-g="' + key + '" data-v="' + esc(v) + '"' + (state.filters[key] === v ? ' class="on"' : "") + ">" +
        esc(names ? names[v] || v : v) + "</button>";
    });
    return h;
  }
  var html = group(S.fDept, "dept", depts) + '<span class="sep"></span>' +
    group(S.fQuadrant, "quadrant", quads, S.quad) + '<span class="sep"></span>' +
    group(S.fAlloc, "alloc", allocs, S.alloc) + '<span class="sep"></span>' +
    group(S.fStatus, "status", statuses, S.status) + '<span class="sep"></span>' +
    '<button data-sort="value"' + (state.sort === "value" ? ' class="on"' : "") + ">" + esc(S.sortValue) + "</button>" +
    '<button data-sort="payback"' + (state.sort === "payback" ? ' class="on"' : "") + ">" + esc(S.sortPayback) + "</button>";
  f.innerHTML = html;
  f.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.hasAttribute("data-sort")) state.sort = b.getAttribute("data-sort");
      else {
        var g = b.getAttribute("data-g"), v = b.getAttribute("data-v");
        state.filters[g] = (state.filters[g] === v) ? "all" : v;
      }
      renderFilters(); renderRegister(); renderScatter();
    });
  });
}

/* ---------------- register ---------------- */
var QCHIP = { "quick-win": "qw", "big-bet": "bb", "fill-in": "fi", discard: "dc" };
function allocVar(a) { return "var(--c-" + a.toLowerCase() + ")"; }
function scoreLine(o) {
  var w = DATA.weights, s = o.scores;
  var v = "<b>" + S.valueW + " " + dec(o.value) + "</b> = " +
    w.value.hours.toLocaleString(locale) + "×" + s.hours + " " + S.wHours + " + " +
    w.value.quality.toLocaleString(locale) + "×" + s.quality + " " + S.wQuality + " + " +
    w.value.strategic.toLocaleString(locale) + "×" + s.strategic + " " + S.wStrategic;
  var f = "<b>" + S.feasW + " " + dec(o.feasibility) + "</b> = " +
    w.feasibility.data.toLocaleString(locale) + "×" + s.data + " " + S.wData + " + " +
    w.feasibility.technical.toLocaleString(locale) + "×" + s.technical + " " + S.wTechnical + " + " +
    w.feasibility.ownership.toLocaleString(locale) + "×" + s.ownership + " " + S.wOwnership;
  return v + "<br>" + f + "<br><b>" + S.adoption + " " + s.adoption + "/5</b>";
}
function costLine(o) {
  var tpl = o.tooling > 0 ? S.costLine : S.costLineNoTool;
  return T(tpl, {
    days: o.days, rate: fmtFull(DATA.day_rate), tooling: fmtFull(o.tooling), y1: "<strong>" + fmtFull(o.year1_cost) + "</strong>"
  });
}
function renderRegister() {
  var list = DATA.opps.filter(matchesFilters);
  list.sort(state.sort === "value"
    ? function (a, b) { return (isFinite(oppValue(b)) ? oppValue(b) : -1) - (isFinite(oppValue(a)) ? oppValue(a) : -1); }
    : function (a, b) { return oppPayback(a) - oppPayback(b); });
  var open = {};
  document.querySelectorAll("#reg-list details[open]").forEach(function (d) { open[d.id] = true; });
  document.getElementById("reg-list").innerHTML = list.map(function (o) {
    var v = oppValue(o), isDiscard = o.verdict === "discard";
    var conf = S.confMap[(o.confidence || "").toLowerCase()] || o.confidence || "";
    var pains = o.pains.map(function (p) { return '<span class="chip plain">' + esc(p) + "</span>"; }).join(" ");
    var procs = o.processes.map(function (p) { return '<span class="chip plain">' + esc(p) + "</span>"; }).join(" ");
    return '<details class="opp' + (isDiscard ? " discard" : "") + '" id="d-' + o.id + '"' + (open["d-" + o.id] ? " open" : "") + ">" +
      "<summary>" +
      (!isDiscard ? '<input type="checkbox" class="pick" data-id="' + o.id + '"' +
        (state.selected[o.id] ? " checked" : "") + ' aria-label="' + esc(S.pick) + " " + o.id + '">' : "") +
      '<span class="oid">' + o.id + '</span><span class="ot">' + esc(o.title) + "</span>" +
      '<span class="chip plain"><i style="background:' + allocVar(o.allocation) + '"></i>' + esc(S.alloc[o.allocation] || o.allocation) + "</span>" +
      '<span class="chip ' + QCHIP[o.quadrant] + '">' + esc(S.quad[o.quadrant]) + "</span>" +
      '<span class="chip plain">' + (o.wave >= 1 ? S.wave + " " + o.wave : "—") + " · " + esc(o.effort) + "</span>" +
      '<span class="ov">' + (isFinite(v) ? fmt(v) + S.perYear : "—") + "</span>" +
      "</summary>" +
      '<div class="o-body">' +
      "<div><h4>" + S.hScores + '</h4><p class="scoreline">' + scoreLine(o) + "</p></div>" +
      "<div><h4>" + S.hPains + "</h4><p>" + (pains || "—") + (procs ? "<br>" + procs : "") + "</p></div>" +
      (o.formula_text
        ? '<div class="full"><h4>' + S.hFormula + "</h4><p><code>" + esc(readableFormula(o)) + "</code> = <strong>" +
          fmt(v) + S.perYear + "</strong></p></div>" : "") +
      "<div><h4>" + S.hCost + "</h4><p>" + costLine(o) + "</p></div>" +
      "<div><h4>" + S.hPayback + "</h4><p><strong>" + fmtMonths(oppPayback(o)) + "</strong></p></div>" +
      '<div class="full"><h4>' + S.hVerdict + '</h4><p><span class="chip ' + QCHIP[o.verdict] + '">' + esc(S.quad[o.verdict]) + "</span>" +
      (conf ? " · " + S.confidence + ": <strong>" + esc(conf) + "</strong>" : "") +
      (o.would_change ? "<br><em>" + S.hWouldChange + ":</em> " + esc(o.would_change) : "") + "</p></div>" +
      (o.enablers ? "<div><h4>" + S.hEnablers + "</h4><p>" + esc(o.enablers) + "</p></div>" : "") +
      (o.risk ? "<div><h4>" + S.hRisk + "</h4><p>" + esc(o.risk) + "</p></div>" : "") +
      (o.first_step ? '<div class="full"><h4>' + S.hFirstStep + "</h4><p>" + esc(o.first_step) + "</p></div>" : "") +
      "</div></details>";
  }).join("") || '<p class="sub">' + esc(S.noMatch) + "</p>";
  document.querySelectorAll("#reg-list .pick").forEach(function (cb) {
    cb.addEventListener("click", function (e) { e.stopPropagation(); });
    cb.addEventListener("change", function () {
      if (cb.checked) state.selected[cb.getAttribute("data-id")] = true;
      else delete state.selected[cb.getAttribute("data-id")];
      renderRoadmap(); renderConfirmBar();
    });
  });
}
function openCard(id) {
  var el = document.getElementById("d-" + id);
  if (!el) {
    state.filters = { dept: "all", quadrant: "all", alloc: "all", status: "all" };
    renderFilters(); renderRegister(); renderScatter();
    el = document.getElementById("d-" + id);
  }
  if (el) { el.open = true; el.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

/* ---------------- quadrant scatter ---------------- */
function renderLegend() {
  var allocs = uniq(DATA.opps.map(function (o) { return o.allocation; }));
  document.getElementById("viz-legend").innerHTML = allocs.map(function (a) {
    return '<span class="chip plain"><i style="background:' + allocVar(a) + '"></i>' + esc(S.alloc[a] || a) + "</span>";
  }).join("") + '<span style="margin-left:auto;color:var(--ink-3);font-size:11.5px">' + esc(S.legendHint) + "</span>";
}
function renderScatter() {
  var W = 940, H = 470, mL = 56, mR = 30, mT = 26, mB = 46;
  var iw = W - mL - mR, ih = H - mT - mB;
  var lo = 0.8, hiD = 5.2, span = hiD - lo;
  var X = function (s) { return mL + ((s - lo) / span) * iw; };
  var Y = function (s) { return mT + ih - ((s - lo) / span) * ih; };
  var bx = X(DATA.weights.high), by = Y(DATA.weights.high);
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(S.hMap) + '">';
  /* quadrant shading */
  s += '<rect class="qbg" x="' + bx + '" y="' + mT + '" width="' + (W - mR - bx) + '" height="' + (by - mT) + '" fill="var(--accent)" opacity=".06"/>';
  s += '<rect class="qbg" x="' + mL + '" y="' + by + '" width="' + (bx - mL) + '" height="' + (mT + ih - by) + '" fill="var(--ink)" opacity=".045"/>';
  /* gridlines (pointer-events:none via CSS) */
  for (var g = 1; g <= 5; g++) {
    s += '<line x1="' + X(g) + '" y1="' + mT + '" x2="' + X(g) + '" y2="' + (mT + ih) + '" stroke="var(--grid)" stroke-width="1"/>';
    s += '<line x1="' + mL + '" y1="' + Y(g) + '" x2="' + (W - mR) + '" y2="' + Y(g) + '" stroke="var(--grid)" stroke-width="1"/>';
    s += '<text class="axl" x="' + X(g) + '" y="' + (H - mB + 16) + '" text-anchor="middle">' + g + "</text>";
    s += '<text class="axl" x="' + (mL - 10) + '" y="' + (Y(g) + 4) + '" text-anchor="end">' + g + "</text>";
  }
  /* the 3.5 boundary */
  s += '<line x1="' + bx + '" y1="' + mT + '" x2="' + bx + '" y2="' + (mT + ih) + '" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1.2"/>';
  s += '<line x1="' + mL + '" y1="' + by + '" x2="' + (W - mR) + '" y2="' + by + '" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1.2"/>';
  /* quadrant labels */
  s += '<text class="quad" x="' + (W - mR - 8) + '" y="' + (mT + 16) + '" text-anchor="end">' + esc(S.qQw) + "</text>";
  s += '<text class="quad" x="' + (mL + 8) + '" y="' + (mT + 16) + '">' + esc(S.qBb) + "</text>";
  s += '<text class="quad" x="' + (W - mR - 8) + '" y="' + (mT + ih - 10) + '" text-anchor="end">' + esc(S.qFi) + "</text>";
  s += '<text class="quad" x="' + (mL + 8) + '" y="' + (mT + ih - 10) + '">' + esc(S.qDc) + "</text>";
  /* axis titles */
  s += '<text class="axl" x="' + (mL + iw / 2) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(S.axisX) + "</text>";
  s += '<text class="axl" transform="translate(16 ' + (mT + ih / 2) + ') rotate(-90)" text-anchor="middle">' + esc(S.axisY) + "</text>";
  /* dots — jitter same-position groups ≥52px apart, labels to the right */
  var groups = {};
  DATA.opps.forEach(function (o) {
    var k = o.feasibility.toFixed(2) + "|" + o.value.toFixed(2);
    (groups[k] = groups[k] || []).push(o);
  });
  Object.keys(groups).forEach(function (k) {
    groups[k].forEach(function (o, i) {
      var n = groups[k].length;
      var off = n > 1 ? (i - (n - 1) / 2) * 60 : 0; /* >=52px so dot + label clear the neighbour */
      var cx = Math.max(mL + 12, Math.min(W - mR - 12, X(o.feasibility) + off));
      var cy = Y(o.value);
      var dim = matchesFilters(o) ? "" : " dim";
      s += '<g class="pt' + dim + '" data-opp="' + o.id + '" tabindex="0" style="cursor:pointer" role="button" aria-label="' + o.id + " " + esc(o.title) + '">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="9" fill="' + allocVar(o.allocation) + '" stroke="var(--card)" stroke-width="2"' +
        (o.verdict === "discard" ? ' fill-opacity=".45"' : "") + "/>" +
        '<text class="dotl" x="' + (cx + 12) + '" y="' + (cy + 4) + '">' + o.id + "</text></g>";
    });
  });
  s += "</svg>";
  document.getElementById("scatter").innerHTML = s;
  var tip = document.getElementById("tip");
  document.querySelectorAll("#scatter .pt").forEach(function (g) {
    var o = DATA.opps.find(function (x) { return x.id === g.getAttribute("data-opp"); });
    function show(ev) {
      var v = oppValue(o);
      tip.innerHTML = "<b>" + o.id + " · " + esc(o.title) + "</b>" +
        '<span class="figure">' + S.valueW + " " + dec(o.value) + " · " + S.feasW + " " + dec(o.feasibility) +
        (isFinite(v) ? " · " + fmt(v) + S.perYear : "") + " · " + fmtMonths(oppPayback(o)) + "</span><br>" +
        '<span class="chip ' + QCHIP[o.quadrant] + '">' + esc(S.quad[o.quadrant]) + "</span>";
      tip.style.display = "block";
      var p = ev.touches ? ev.touches[0] : ev;
      tip.style.left = Math.min(p.clientX + 14, window.innerWidth - 320) + "px";
      tip.style.top = (p.clientY + 14) + "px";
    }
    g.addEventListener("mousemove", show);
    g.addEventListener("mouseleave", function () { tip.style.display = "none"; });
    g.addEventListener("click", function () { tip.style.display = "none"; openCard(o.id); });
    g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCard(o.id); } });
  });
}

/* ---------------- roadmap waves ---------------- */
function renderRoadmap() {
  var el = document.getElementById("waves");
  el.innerHTML = [1, 2, 3].map(function (w) {
    var items = DATA.opps.filter(function (o) { return o.wave === w; })
      .sort(function (a, b) { return (oppValue(b) || 0) - (oppValue(a) || 0); });
    var sel = items.filter(function (o) { return state.selected[o.id]; });
    var v = 0, c = 0;
    sel.forEach(function (o) { var x = oppValue(o); if (isFinite(x)) v += x; c += o.year1_cost; });
    var pb = v > 0 ? c / (v / 12) : Infinity;
    return '<div class="wave"><div class="w-h"><div class="t">' + S.wave + " " + w + '</div>' +
      '<div class="s">' + esc(S.waveSubs[w]) + " · " + T(S.waveSelected, { n: sel.length, m: items.length }) + "</div>" +
      '<div class="v">' + T(S.waveTotals, { v: fmt(v), c: fmt(c), p: fmtMonths(pb) }) + "</div></div><ul>" +
      (items.length ? items.map(function (o) {
        var x = oppValue(o);
        return '<li class="' + (state.selected[o.id] ? "" : "off") + '">' +
          '<span class="oref" data-opp="' + o.id + '">' + o.id + "</span> · " + esc(o.title) +
          (isFinite(x) ? ' <span class="liv">' + fmt(x) + S.perYear + "</span>" : "") + "</li>";
      }).join("") : "<li>" + esc(S.waveEmpty) + "</li>") +
      "</ul></div>";
  }).join("");
  el.querySelectorAll(".oref").forEach(function (r) {
    r.addEventListener("click", function () { openCard(r.getAttribute("data-opp")); });
  });
}

/* ---------------- select & confirm ---------------- */
function selectionTotals() {
  var v = 0, c = 0;
  selectedOpps().forEach(function (o) { var x = oppValue(o); if (isFinite(x)) v += x; c += o.year1_cost; });
  return { n: selectedOpps().length, value: v, cost: c, payback: v > 0 ? c / (v / 12) : Infinity };
}
function renderConfirmBar() {
  var t = selectionTotals();
  document.getElementById("cb-count").innerHTML = T(esc(S.cbCount), { n: "<b>" + t.n + "</b>" });
  document.getElementById("cb-value").innerHTML = T(esc(S.cbValue), { v: "<b>" + fmt(t.value) + S.perYear + "</b>" });
  document.getElementById("cb-cost").innerHTML = T(esc(S.cbCost), { c: "<b>" + fmt(t.cost) + "</b>" });
  document.getElementById("cb-btn").disabled = t.n === 0;
}
function buildExport() {
  var sel = { wave1: [], wave2: [], wave3: [] };
  selectedOpps().forEach(function (o) { if (o.wave >= 1) sel["wave" + o.wave].push(o.id); });
  var t = selectionTotals();
  return {
    client: DATA.client, slug: DATA.slug, language: lang,
    date: DATA.built,                       /* build timestamp of this proposal */
    confirmed_at: new Date().toISOString(), /* moment of confirmation */
    selections: sel,
    assumptions: JSON.parse(JSON.stringify(state.A)),
    totals: { annual_value: Math.round(t.value), year1_cost: Math.round(t.cost) }
  };
}
function initConfirm() {
  var dlg = document.getElementById("confirm-dialog");
  document.getElementById("cb-btn").addEventListener("click", function () {
    var body = document.getElementById("d-body"), t = selectionTotals();
    body.innerHTML = [1, 2, 3].map(function (w) {
      var sel = selectedOpps().filter(function (o) { return o.wave === w; });
      if (!sel.length) return "";
      return "<h4>" + S.wave + " " + w + "</h4><ul>" + sel.map(function (o) {
        return '<li><span class="oid">' + o.id + "</span> " + esc(o.title) +
          ' <span class="figure">· ' + fmt(oppValue(o)) + S.perYear + "</span></li>";
      }).join("") + "</ul>";
    }).join("") || "<p>" + esc(S.dNone) + "</p>";
    document.getElementById("d-total").textContent =
      T(S.dTotal, { v: fmt(t.value), c: fmt(t.cost), p: fmtMonths(t.payback) });
    var a = document.getElementById("d-download");
    a.setAttribute("download", "roadmap-" + DATA.slug.replace(/^_+/, "") + "-confirmed.json");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(buildExport(), null, 2));
    dlg.showModal();
  });
  /* refresh the payload right before download in case sliders moved while open */
  document.getElementById("d-download").addEventListener("click", function () {
    this.href = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(buildExport(), null, 2));
  });
  document.getElementById("d-print").addEventListener("click", function () { dlg.close(); window.print(); });
  document.getElementById("d-close").addEventListener("click", function () { dlg.close(); });
}

/* ---------------- one render path ---------------- */
function rerender() {
  renderHeadline(); renderRegister(); renderScatter(); renderRoadmap(); renderConfirmBar();
}
initChrome(); initTheme(); initAssumptions(); initConfirm();
renderFilters(); renderLegend(); rerender();
})();

</script>
</body>
</html>
